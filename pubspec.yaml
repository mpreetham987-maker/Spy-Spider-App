name: spy_spider_vision
description: "Premium controller application for a 4-legged spy spider robot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  # State management
  provider: ^6.1.5+1

  # Typography & animation
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2

  # Bluetooth Low Energy
  # Kept on the existing line until licensing and 2.x migration are reviewed.
  flutter_blue_plus: ^1.35.5

  # Networking / ESP32-CAM MJPEG stream
  http: ^1.6.0

  # UI utilities
  smooth_page_indicator: ^3.0.0

  # Persistence
  shared_preferences: ^2.5.6

  # On-device AI object detection
  google_mlkit_object_detection: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Add asset declarations here as you drop files into assets/images
  # or assets/icons, e.g.:
  # assets:
  #   - assets/images/
  #   - assets/icons/
